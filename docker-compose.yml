version: '3.8'

services:
  diction:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diction-app
    ports:
      - "3000:3000"
    environment:
      # Anthropic API Key - REQUIRED
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # ElevenLabs Configuration
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}

      # Secret token for /create route access
      - CREATE_SECRET_TOKEN=${CREATE_SECRET_TOKEN}

      # Passphrase for /create access (public-facing alternative)
      - CREATE_PASSPHRASE=${CREATE_PASSPHRASE:-}

      # Server configuration
      - PORT=3000
      - NODE_ENV=production

    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    # Security options
    security_opt:
      - no-new-privileges:true

    # Resource limits (optional, adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
