<!DOCTYPE html>
<html lang="{{langCode}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{forbiddenTitle}}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✍🏽</text></svg>">
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .error-box {
      text-align: center;
      max-width: 440px;
      width: 100%;
      background: #fffcf8;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(60,40,20,0.1);
    }
    .error-box h1 {
      color: #993b2b;
      border-bottom: none;
      margin-bottom: 8px;
    }
    .error-box p {
      color: #6b5c4a;
      margin-bottom: 16px;
    }
    .error-box a {
      color: #993b2b;
    }
    html.dark .error-box,
    html:not(.light) .error-box {
      background: #211c17;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    html.dark .error-box h1,
    html:not(.light) .error-box h1 {
      color: #c4654e;
    }
    html.dark .error-box p,
    html:not(.light) .error-box p {
      color: #9a8b78;
    }
    html.dark .error-box a,
    html:not(.light) .error-box a {
      color: #c4654e;
    }
  </style>
  <script>
    (function() {
      var c = document.cookie.match(/(?:^|; )theme=(\w+)/);
      var t = c ? c[1] : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.className = t;
    })();
  </script>
</head>
<body>
  <div class="error-box">
    <h1>{{forbiddenTitle}}</h1>
    <p>{{forbiddenMessage}}</p>
    <p><a href="/">{{forbiddenBack}}</a></p>
  </div>
</body>
</html>
