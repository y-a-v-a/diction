<h1>{{createHeading}}</h1>

<p class="description">
  {{createDescription}}
</p>

{{error}}

<form method="POST" action="/create" id="createForm">
  {{tokenInput}}
  {{csrfInput}}
  <div>
    <label for="language">{{languageLabel}}</label>
    {{languageSelect}}
  </div>

  <div>
    <label for="topic1">{{topic1Label}}</label>
    <input type="text" id="topic1" name="topic1" required maxlength="100" placeholder="{{topic1Placeholder}}">
  </div>

  <div>
    <label for="topic2">{{topic2Label}}</label>
    <input type="text" id="topic2" name="topic2" required maxlength="100" placeholder="{{topic2Placeholder}}">
  </div>

  <div>
    <label for="topic3">{{topic3Label}}</label>
    <input type="text" id="topic3" name="topic3" required maxlength="100" placeholder="{{topic3Placeholder}}">
  </div>

  <div>
    <label for="sentenceCount">{{sentenceCountLabel}}</label>
    <input type="number" id="sentenceCount" name="sentenceCount" required min="1" max="8" value="8" placeholder="8">
  </div>

  <div>
    <label for="pin">{{pinLabel}}</label>
    <input type="text" id="pin" name="pin" pattern="[0-9]{4,6}" minlength="4" maxlength="6" inputmode="numeric" placeholder="1234">
    <small class="field-hint">{{pinHint}}</small>
  </div>

  <button type="submit">{{generateButton}}</button>
  <a href="/" class="cancel-link">{{cancelButton}}</a>
</form>

<div id="loading" class="loading" style="display: none;">
  <p><strong>{{generating}}</strong></p>
  <p>{{generatingHint}}</p>
</div>

<script>
  document.getElementById('createForm').addEventListener('submit', function() {
    document.getElementById('loading').style.display = 'block';
    this.style.display = 'none';
  });
</script>
