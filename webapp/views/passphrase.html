<!DOCTYPE html>
<html lang="{{langCode}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{passphraseHeading}} — Diction</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script>
    (function() {
      var c = document.cookie.match(/(?:^|; )theme=(\w+)/);
      var t = c ? c[1] : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.className = t;
    })();
  </script>
</head>
<body class="gate-page">
  <div class="gate-box">
    <img src="/favicon.svg" class="brand-mark" alt="">
    <h1>{{passphraseHeading}}</h1>
    <p>{{passphraseDescription}}</p>
    {{error}}
    <form method="POST" action="/create/auth">
      {{csrfInput}}
      <input type="password" name="passphrase" class="passphrase-input" placeholder="{{passphrasePlaceholder}}" required autofocus>
      <button type="submit" class="passphrase-submit">{{submit}}</button>
    </form>
    <a href="/" class="back-link">{{backHome}}</a>
  </div>
</body>
</html>
