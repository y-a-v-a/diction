<!DOCTYPE html>
<html lang="{{langCode}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{passphraseHeading}} — Diction</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✍🏽</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap">
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .passphrase-box {
      text-align: center;
      max-width: 440px;
      width: 100%;
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .passphrase-box h1 {
      border-bottom: none;
      margin-bottom: 8px;
    }
    .passphrase-box p {
      margin-bottom: 20px;
      color: #666;
    }
    .passphrase-input {
      font-size: 1.2rem;
      padding: 12px 15px;
      width: 100%;
      max-width: 320px;
      box-sizing: border-box;
    }
    .passphrase-submit {
      font-size: 1.1rem;
      padding: 12px 30px;
      margin-top: 12px;
    }
    .back-link {
      display: inline-block;
      margin-top: 16px;
      color: #666;
    }
    @media (prefers-color-scheme: dark) {
      .passphrase-box { background: #2d2d2d; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
      .passphrase-box p { color: #999; }
      .back-link { color: #999; }
    }
  </style>
</head>
<body>
  <div class="passphrase-box">
    <h1>{{passphraseHeading}}</h1>
    <p>{{passphraseDescription}}</p>
    {{error}}
    <form method="POST" action="/create/auth">
      {{csrfInput}}
      <input type="password" name="passphrase" class="passphrase-input" placeholder="{{passphrasePlaceholder}}" required autofocus>
      <br>
      <button type="submit" class="passphrase-submit">{{submit}}</button>
    </form>
    <a href="/" class="back-link">{{backHome}}</a>
  </div>
</body>
</html>
