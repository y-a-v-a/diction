<!DOCTYPE html>
<html lang="{{langCode}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} — {{enterPin}}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✍🏽</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap">
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .pin-box {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .pin-box h1 {
      border-bottom: none;
      margin-bottom: 10px;
    }
    .pin-box p {
      margin-bottom: 20px;
      color: #666;
    }
    .pin-input {
      font-size: 2rem;
      text-align: center;
      letter-spacing: 0.5em;
      padding: 15px;
      max-width: 250px;
    }
    .pin-submit {
      font-size: 1.1rem;
      padding: 12px 30px;
      margin-top: 10px;
    }
    .pin-box p { color: #7a6b58; }
    html.dark .pin-box p,
    html:not(.light) .pin-box p { color: #7a6e60; }
  </style>
  <script>
    (function() {
      var c = document.cookie.match(/(?:^|; )theme=(\w+)/);
      var t = c ? c[1] : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.className = t;
    })();
  </script>
</head>
<body>
  <div class="pin-box">
    <h1>{{title}}</h1>
    <p>{{enterPin}}</p>
    {{error}}
    <form method="POST" action="/dictation/{{dictationId}}/play">
      {{csrfInput}}
      <input type="text" name="pin" class="pin-input" pattern="[0-9]{4,6}" minlength="4" maxlength="6" inputmode="numeric" placeholder="{{pinPlaceholder}}" required autofocus>
      <br>
      <button type="submit" class="pin-submit">{{submit}}</button>
    </form>
  </div>
</body>
</html>
