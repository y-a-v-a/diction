<h1>{{title}} {{languageIndicator}}</h1>

<p class="topics-line"><strong>{{topicsLabel}}:</strong> {{topics}}</p>
<p class="date-text actions-wrapper">{{dateLabel}}: {{date}}</p>

{{warning}}

<div class="actions-wrapper">
  {{playModeLink}}
  {{showTextButton}}
  <a href="/dictations" class="cancel-link">{{backHome}}</a>
</div>

<div class="audio-container">
  {{audioPlayers}}
</div>

<form method="POST" action="/dictation/{{dictationId}}/delete" class="delete-form" data-confirm="{{deleteConfirm}}" onsubmit="return confirm(this.dataset.confirm);">
  <button type="submit" class="delete">{{deleteDictation}}</button>
</form>

<script>
  var showTextBtn = document.getElementById('showTextBtn');
  if (showTextBtn) {
    showTextBtn.addEventListener('click', function() {
      document.querySelectorAll('.sentence-text').forEach(function(el) {
        el.style.display = 'block';
      });
      this.style.display = 'none';
    });
  }
</script>
