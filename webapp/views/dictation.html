<h1>{{title}} {{languageIndicator}}</h1>

<p class="topics-line"><strong>{{topicsLabel}}:</strong> {{topics}}</p>
<p class="date-text actions-wrapper">{{dateLabel}}: {{date}}</p>

{{warning}}

<div class="actions-wrapper">
  {{playModeLink}}
  {{showTextButton}}
  <a href="/dictations" class="cancel-link">{{backHome}}</a>
</div>

<div class="audio-container">
  {{audioPlayers}}
</div>

{{deleteForm}}

<script>
  var showTextBtn = document.getElementById('showTextBtn');
  if (showTextBtn) {
    var showLabel = '{{showText}}';
    var hideLabel = '{{hideText}}';
    showTextBtn.addEventListener('click', function() {
      var texts = document.querySelectorAll('.sentence-text');
      var anyHidden = false;
      texts.forEach(function(el) { if (el.hidden) anyHidden = true; });
      texts.forEach(function(el) { el.hidden = !anyHidden; });
      this.textContent = anyHidden ? hideLabel : showLabel;
    });
  }
</script>
