<h1>Dictee: {{id}}</h1>

<p class="topics-line"><strong>Onderwerpen:</strong> {{topics}}</p>
<p class="date-text actions-wrapper">Gemaakt op: {{date}}</p>

{{warning}}

<div class="actions-wrapper">
  <button id="showTextBtn" class="secondary">Toon Tekst</button>
  <a href="/" class="cancel-link">Terug naar Home</a>
</div>

<div class="audio-container">
  {{audioPlayers}}
</div>

<form method="POST" action="/dictation/{{id}}/delete" class="delete-form" onsubmit="return confirm('Weet je zeker dat je dit dictee wilt verwijderen?');">
  <button type="submit" class="delete">Dictee Verwijderen</button>
</form>

<script>
  document.getElementById('showTextBtn').addEventListener('click', function() {
    const textElements = document.querySelectorAll('.sentence-text');
    textElements.forEach(el => {
      el.style.display = 'block';
    });
    this.style.display = 'none';
  });
</script>

<style>
  .date-text {
    color: #666;
  }

  .audio-container {
    background: #f9f9f9;
    padding: 20px;
    border-radius: 4px;
  }

  .sentence-item {
    margin-bottom: 25px;
    padding: 15px;
    background: white;
    border-radius: 4px;
    border: 1px solid #ddd;
  }

  .sentence-number {
    font-weight: bold;
    color: #3498db;
    margin-bottom: 8px;
  }

  audio {
    width: 100%;
    margin-bottom: 10px;
  }

  .sentence-text {
    display: none;
    padding: 10px;
    background: #e8f4f8;
    border-left: 3px solid #3498db;
    margin-top: 10px;
    color: #2c3e50;
  }

  @media (prefers-color-scheme: dark) {
    .date-text {
      color: #999;
    }

    .audio-container {
      background: #252525;
    }

    .sentence-item {
      background: #3a3a3a;
      border-color: #555;
    }

    .sentence-number {
      color: #4a9eff;
    }

    .sentence-text {
      background: #1a3a4a;
      border-left-color: #4a9eff;
      color: #d0d0d0;
    }
  }
</style>
